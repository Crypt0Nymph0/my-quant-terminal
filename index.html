<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Proprietary Sovereign Quant Terminal</title>
<script src="https://unpkg.com"></script>
<style>
* { box-sizing: border-box; }
body { background-color: #0b0e11; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
header { background-color: #131722; border-bottom: 1px solid #2a2e39; padding: 12px; display: flex; justify-content: space-between; align-items: center; width: 100%; height: 50px; }
.title { color: #a855f7; font-weight: bold; font-size: 13px; letter-spacing: 1px; }
.ticker { background-color: #1e222d; padding: 6px 12px; border-radius: 4px; border: 1px solid #2a2e39; font-size: 11px; }
#chart-container { width: 100%; flex: 1; background-color: #131722; position: relative; min-height: 200px; }
.ai-panel { width: 100%; height: 160px; background-color: #131722; border-top: 1px solid #2a2e39; display: flex; flex-direction: column; padding: 12px; z-index: 10; }
.ai-title { font-size: 10px; color: #a855f7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: bold; }
textarea { width: 100%; height: 65px; background-color: #1e222d; border: 1px solid #2a2e39; border-radius: 4px; padding: 8px; color: #fff; font-size: 12px; resize: none; outline: none; }
textarea:focus { border-color: #a855f7; }
button { width: 100%; background-color: #9333ea; color: white; border: none; padding: 10px; border-radius: 4px; margin-top: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
button:active { transform: scale(0.99); background-color: #7e22ce; }
.green-text { color: #26a69a; font-weight: bold; }
.red-text { color: #ef5350; font-weight: bold; }
</style>
</head>
<body>
<header>
<div class="title">SOVEREIGN QUANT // TERMINAL</div>
<div class="ticker">BTCUSDT <span id="price-ticker" class="green-text">$67,420.00</span></div>
</header>
<div id="chart-container"></div>
<div class="ai-panel">
<div class="ai-title">Proprietary AI Strategy Core</div>
<textarea id="ai-prompt" placeholder="Type strategy rule (e.g., 'Plot 3-bar moving average overlay trend line...')"></textarea>
<button id="generate-btn">Run AI Generator Engine</button>
</div>
<script>
const container = document.getElementById('chart-container');
const priceTicker = document.getElementById('price-ticker');
let chart, candlestickSeries, movingAverageLineSeries = null;
function initChart() {
if (!container) return;
chart = LightweightCharts.createChart(container, {
layout: { background: { type: 'vertical', color: '#131722' }, textColor: '#d1d4dc' },
grid: { vertLines: { color: 'rgba(42, 46, 57, 0.12)' }, horzLines: { color: 'rgba(42, 46, 57, 0.12)' } },
crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
rightPriceScale: { borderColor: 'rgba(42, 46, 57, 0.8)', visible: true },
timeScale: { borderColor: 'rgba(42, 46, 57, 0.8)', timeVisible: true }
});
candlestickSeries = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
}
initChart();
let data = [
{ time: 1717192800, open: 67100.0, high: 67300.0, low: 67000.0, close: 67200.0 },
{ time: 1717196400, open: 67200.0, high: 67550.0, low: 67100.0, close: 67420.0 },
{ time: 1717200000, open: 67420.0, high: 67900.0, low: 67350.0, close: 67810.0 },
{ time: 1717203600, open: 67810.0, high: 68120.0, low: 67700.0, close: 67950.0 },
{ time: 1717207200, open: 67950.0, high: 68000.0, low: 67400.0, close: 67520.0 },
{ time: 1717210800, open: 67520.0, high: 67680.0, low: 67150.0, close: 67300.0 },
{ time: 1717214400, open: 67300.0, high: 67750.0, low: 67280.0, close: 67695.0 }
];
if (candlestickSeries) { candlestickSeries.setData(data); }
function updateLayoutSize() {
if (chart && container) {
chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
}
}
window.addEventListener('resize', updateLayoutSize);
setTimeout(updateLayoutSize, 200);
let lastBar = data[data.length - 1];
setInterval(() => {
const change = (Math.random() - 0.49) * 35;
lastBar.close = parseFloat((lastBar.close + change).toFixed(2));
if (lastBar.close > lastBar.high) lastBar.high = lastBar.close;
if (lastBar.close < lastBar.low) lastBar.low = lastBar.close;
if (candlestickSeries) { candlestickSeries.update(lastBar); }
priceTicker.innerText = `$${lastBar.close.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
if (lastBar.close >= lastBar.open) { priceTicker.className = "green-text"; } else { priceTicker.className = "red-text"; }
}, 1000);
function calculateSimpleMovingAverage(candleArray, period) {
let smaData = [];
for (let i = 0; i < candleArray.length; i++) {
if (i < period - 1) continue;
let sum = 0;
for (let j = 0; j < period; j++) { sum += candleArray[i - j].close; }
smaData.push({ time: candleArray[i].time, value: parseFloat((sum / period).toFixed(2)) });
}
return smaData;
}
document.getElementById('generate-btn').addEventListener('click', () => {
const promptValue = document.getElementById('ai-prompt').value.toLowerCase();
if (!promptValue.trim()) return alert("Please enter a strategy blueprint first!");
if (promptValue.includes('moving average') || promptValue.includes('sma') || promptValue.includes('ma')) {
if (movingAverageLineSeries) { chart.removeSeries(movingAverageLineSeries); }
movingAverageLineSeries = chart.addLineSeries({ color: '#f59e0b', lineWidth: 2, title: 'AI MA Line' });
let computedPoints = calculateSimpleMovingAverage(data, 3);
movingAverageLineSeries.setData(computedPoints);
alert("AI Compiler Success: Formulated and overlayed mathematical Moving Average tracking matrix directly onto candlesticks.");
} else {
alert("Independent Core Received Request: " + promptValue + "\n(Math compiling library ready for connection)");
}
});
</script>
</body>
</html>
